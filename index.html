<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunset Park Brooklyn — Live People Counter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Live video fills the viewport */
    #cam-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Canvas overlays the image for bounding boxes */
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* ── Loading overlay ── */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.92);
      z-index: 30;
      padding: 24px;
      text-align: center;
      transition: opacity 0.6s;
    }
    #overlay.gone { opacity: 0; pointer-events: none; }

    .title { font-size: clamp(1rem, 3vw, 1.8rem); font-weight: 700; letter-spacing: -.02em; }
    .sub   { font-size: .8rem; color: #555; margin-top: 6px; margin-bottom: 32px; }

    .spinner {
      width: 40px; height: 40px;
      border: 2.5px solid #222; border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #msg { font-size: .82rem; color: #666; min-height: 20px; }

    /* ── LIVE badge ── */
    #live-badge {
      position: absolute; top: 14px; left: 14px;
      background: #e63946; color: #fff;
      font-size: .62rem; font-weight: 800; letter-spacing: .12em;
      padding: 3px 9px 3px 7px; border-radius: 4px;
      z-index: 10; display: none; align-items: center; gap: 5px;
    }
    #live-badge::before {
      content: ''; width: 6px; height: 6px;
      background: #fff; border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ── Counter ── */
    #counter-box {
      position: absolute; top: 14px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; display: none;
      flex-direction: column; align-items: center;
      background: rgba(0,0,0,0.70);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 14px;
      padding: 10px 24px 8px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      min-width: 120px;
    }
    #counter-number {
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      font-weight: 800; line-height: 1; color: #fff;
      letter-spacing: -.03em;
      font-variant-numeric: tabular-nums;
    }
    #counter-label {
      font-size: .62rem; font-weight: 600;
      letter-spacing: .1em; color: rgba(255,255,255,.4);
      margin-top: 4px; text-transform: uppercase;
    }

    /* ── AI status ── */
    #ai-status {
      position: absolute; top: 14px; right: 14px;
      z-index: 10; display: none;
      align-items: center; gap: 6px;
      background: rgba(0,0,0,0.60);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 6px; padding: 4px 10px;
      font-size: .62rem; font-weight: 700;
      letter-spacing: .08em; color: rgba(255,255,255,.5);
      backdrop-filter: blur(6px);
    }
    #ai-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #facc15; transition: background .3s;
    }
    #ai-dot.active  { background: #4ade80; }
    #ai-dot.loading { background: #facc15; animation: pulse 1s ease-in-out infinite; }

    /* ── Bottom labels ── */
    #cam-label {
      position: absolute; bottom: 14px; left: 14px;
      font-size: .68rem; color: rgba(255,255,255,.22);
      z-index: 10; pointer-events: none;
    }
    #next-refresh {
      position: absolute; bottom: 14px; left: 50%;
      transform: translateX(-50%);
      font-size: .6rem; color: rgba(255,255,255,.18);
      z-index: 10; pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
    #refresh {
      position: absolute; bottom: 14px; right: 14px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.5); padding: 5px 13px;
      border-radius: 6px; font-size: .72rem; cursor: pointer;
      z-index: 10; display: none; transition: background .15s;
    }
    #refresh:hover { background: rgba(255,255,255,.16); }
  </style>
</head>
<body>

<div id="wrap">
  <!--
    Source: NYSDOT / 511NY public camera network
    Camera: I-278 at 15th Street, Sunset Park, Brooklyn
    HLS stream: https://s7.nysdot.skyvdn.com:443/rtplive/R11_286/playlist.m3u8
    CORS: Access-Control-Allow-Origin: * on both .m3u8 and .ts chunks (confirmed)
    Resolution: 1280x720 HD live video

    crossorigin="anonymous" on <video> keeps the canvas untainted so TF.js
    can call model.detect(video) directly on every frame in real time.
  -->
  <video id="cam-img" autoplay muted playsinline crossorigin="anonymous"></video>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <div class="title">Sunset Park · Brooklyn</div>
    <div class="sub">15th Street · Brooklyn, NY · Live</div>
    <div class="spinner"></div>
    <div id="msg">Loading AI model…</div>
  </div>

  <div id="live-badge">LIVE</div>

  <div id="counter-box">
    <div id="counter-number">0</div>
    <div id="counter-label">People detected</div>
  </div>

  <div id="ai-status">
    <div id="ai-dot" class="loading"></div>
    <span id="ai-text">AI loading…</span>
  </div>

  <div id="cam-label">I-278 @ 15th St · Sunset Park · Brooklyn · NYSDOT 511NY</div>
  <div id="next-refresh"></div>
  <button id="refresh" onclick="location.reload()">↺ Refresh</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script>
  /*
   * Source: NYSDOT / 511NY public camera network
   * Camera: I-278 at 15th Street, Sunset Park, Brooklyn
   * HLS: https://s9.nysdot.skyvdn.com:443/rtplive/R11_277/playlist.m3u8
   * CORS: Access-Control-Allow-Origin: * on .m3u8 and .ts chunks
   * Resolution: 1280x720 HD live video
   *
   * <video crossorigin="anonymous"> + CORS: * = canvas stays untainted.
   * TF.js calls model.detect(video) directly on every live frame.
   * No server, no proxy, no GitHub Actions needed.
   */

  const STREAM_URL = 'https://s7.nysdot.skyvdn.com:443/rtplive/R11_286/playlist.m3u8';
  const DETECT_MS  = 800;
  const MIN_CONF   = 0.30;
  const BOX_COLOR  = 'rgba(74, 222, 128, 0.9)';
  const BOX_FILL   = 'rgba(74, 222, 128, 0.08)';

  const video      = document.getElementById('cam-img');
  const canvas     = document.getElementById('canvas');
  const ctx        = canvas.getContext('2d');
  const overlay    = document.getElementById('overlay');
  const msgEl      = document.getElementById('msg');
  const liveBadge  = document.getElementById('live-badge');
  const counterBox = document.getElementById('counter-box');
  const counterNum = document.getElementById('counter-number');
  const aiStatus   = document.getElementById('ai-status');
  const aiDot      = document.getElementById('ai-dot');
  const aiText     = document.getElementById('ai-text');
  const refreshEl  = document.getElementById('refresh');
  const nextRefEl  = document.getElementById('next-refresh');

  let model = null, lastFrame = 0, frameCount = 0, startTime = 0;

  function setMsg(t) { msgEl.textContent = t; }

  /* ── Canvas sizing (object-fit: contain) ── */
  function syncCanvas() {
    const vr = video.getBoundingClientRect();
    const vw = video.videoWidth  || 1280;
    const vh = video.videoHeight || 720;
    const aspect = vw / vh;
    const boxW = vr.width, boxH = vr.height;
    let rw, rh;
    if (boxW / boxH > aspect) { rh = boxH; rw = rh * aspect; }
    else                       { rw = boxW; rh = rw / aspect; }
    canvas.width  = vr.width;
    canvas.height = vr.height;
    return { rx: (boxW - rw) / 2, ry: (boxH - rh) / 2, rw, rh, vw, vh };
  }

  /* ── Draw bounding boxes ── */
  function drawBoxes(predictions, layout) {
    const { rx, ry, rw, rh, vw, vh } = layout;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const sx = rw / vw, sy = rh / vh;
    let count = 0;

    for (const p of predictions) {
      if (p.class !== 'person' || p.score < MIN_CONF) continue;
      count++;
      const [bx, by, bw, bh] = p.bbox;
      const x = rx + bx * sx, y = ry + by * sy, w = bw * sx, h = bh * sy;

      ctx.strokeStyle = BOX_COLOR;
      ctx.fillStyle   = BOX_FILL;
      ctx.lineWidth   = 1.5;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 3);
      ctx.fill();
      ctx.stroke();

      const label    = `${Math.round(p.score * 100)}%`;
      const fontSize = Math.max(10, Math.min(13, w * 0.18));
      ctx.font       = `600 ${fontSize}px -apple-system, sans-serif`;
      const tw = ctx.measureText(label).width;
      const ly = y > 18 ? y - 4 : y + h + fontSize + 2;

      ctx.fillStyle = 'rgba(74,222,128,0.85)';
      ctx.beginPath();
      ctx.roundRect(x, ly - fontSize, tw + 6, fontSize + 4, 3);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.fillText(label, x + 3, ly);
    }
    return count;
  }

  /* ── Inference loop ── */
  async function detectLoop() {
    if (!model || video.readyState < 2 || video.paused || video.ended) {
      requestAnimationFrame(detectLoop);
      return;
    }
    const now = performance.now();
    if (now - lastFrame < DETECT_MS) { requestAnimationFrame(detectLoop); return; }
    lastFrame = now;

    try {
      aiDot.className = 'active';
      const preds  = await model.detect(video);
      const layout = syncCanvas();
      const count  = drawBoxes(preds, layout);
      counterNum.textContent = count;
      aiText.textContent = 'AI active';
      frameCount++;
      const fps = Math.round(frameCount / ((now - startTime) / 1000) * 10) / 10;
      nextRefEl.textContent = `~${fps} fps · COCO-SSD · conf ≥${MIN_CONF}`;
    } catch (e) {
      console.warn('inference error:', e);
    }
    requestAnimationFrame(detectLoop);
  }

  /* ── Load AI model ── */
  async function loadModel() {
    aiStatus.style.display = 'flex';
    aiDot.className = 'loading';
    aiText.textContent = 'AI loading…';
    try {
      await tf.ready();
      try { await tf.setBackend('webgl'); } catch (_) { await tf.setBackend('cpu'); }
      model = await cocoSsd.load({ base: 'mobilenet_v2' });
      aiDot.className = 'active';
      aiText.textContent = 'AI ready';
      startTime = performance.now();
      requestAnimationFrame(detectLoop);
    } catch (e) {
      aiText.textContent = 'AI error';
      console.error('Model load failed:', e);
    }
  }

  /* ── HLS playback ── */
  function play() {
    if (Hls.isSupported()) {
      const hls = new Hls({ liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 10, enableWorker: true });
      hls.loadSource(STREAM_URL);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {});
        overlay.classList.add('gone');
        liveBadge.style.display = 'flex';
        counterBox.style.display = 'flex';
        refreshEl.style.display = 'block';
        loadModel();
      });
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (d.fatal) { setMsg('Stream error. Click Refresh.'); overlay.classList.remove('gone'); }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = STREAM_URL;
      video.addEventListener('loadedmetadata', () => {
        video.play().catch(() => {});
        overlay.classList.add('gone');
        liveBadge.style.display = 'flex';
        counterBox.style.display = 'flex';
        refreshEl.style.display = 'block';
        loadModel();
      }, { once: true });
    } else {
      setMsg('HLS not supported in this browser.');
    }
  }

  window.addEventListener('resize', () => { if (model) syncCanvas(); });

  setMsg('Connecting to live stream…');
  play();
</script>
</body>
</html>
